  .card p{margin:0}
  .card .meta{margin-top:6px;font-size:12.5px}
  .spin{position:absolute;left:24px;top:16px;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid #2A3A5C;border-radius:3px;padding:6px 12px;cursor:pointer}
  .spin:hover{border-color:var(--line)}
  .spin:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #reset{left:96px}
  body.embed .credit{display:none}
  body.embed .hint{bottom:10px}
  .credit{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11.5px;color:#6F7E99;margin:0;pointer-events:none}

const zoom=d3.zoom().scaleExtent([.8,4]).on('start',e=>{if(!resetting) stopSpin(); last=[e.transform.x,e.transform.y];})
 .on('zoom',e=>{ zoomK=e.transform.k; if(resetting){last=[e.transform.x,e.transform.y]; draw(); return;} const dx=e.transform.x-last[0], dy=e.transform.y-last[1]; last=[e.transform.x,e.transform.y];
   const s=0.28/zoomK; rot[0]+=dx*s; rot[1]=Math.max(-90,Math.min(90,rot[1]-dy*s)); hideCard(); draw(); });
d3.select(canvas).call(zoom).on('dblclick.zoom',null);
// reset: clear the highlighted constellation, zoom back out, turn back to the starting view
const HOME=[-80,-10,0];
function resetView(){
  focusAb=null; hideCard();
  resetting=true; d3.select(canvas).call(zoom.transform,d3.zoomIdentity); resetting=false; zoomK=1;
  const from=rot.slice(), to=fromEarth?HOME.slice():[-HOME[0],HOME[1],0];
  if(Math.abs(to[0]-from[0])>180) from[0]+=to[0]>from[0]?360:-360;
  const it=d3.interpolate(from,to);
  d3.transition().duration(reduce?0:900).tween('home',()=>t=>{rot=it(t); draw();})
    .on('end',()=>{ if(!reduce) setSpin(true); });
}
document.getElementById('reset').addEventListener('click',resetView);
window.addEventListener('keydown',e=>{ if(e.key==='Escape') resetView(); });
// hover cards
function showCard(html,x,y){ card.innerHTML=html; card.classList.add('on');
  const bw=card.offsetWidth,bh=card.offsetHeight; let L=x+16,T=y+16; if(L+bw>W-8)L=x-bw-16; if(T+bh>H-8)T=y-bh-16; card.style.left=L+'px'; card.style.top=T+'px'; }
function hideCard(){card.classList.remove('on');}
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
canvas.addEventListener('pointermove',ev=>{
  if(ev.pointerType==='mouse'&&ev.movementX===0&&ev.movementY===0) return;   // ignore the synthetic move browsers send on load
  const r=canvas.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top; let found=null;
  for(const b of labelBoxes) if(x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]){found={t:'c',ab:b[4]};break;}
  if(!found){let best=null,bd=81; for(const p of starPts){const d=(p[0]-x)**2+(p[1]-y)**2; if(d<bd){bd=d;best=p;}} if(best) found={t:'s',s:best[2]};}
  const ab=found?(found.t==='c'?found.ab:found.s[4]):null;
  if(ab!==hoverAb){hoverAb=ab; if(!spinning) draw();}
  if(!found){hideCard();return;}
  if(found.t==='c'){const c=DATA.cons[found.ab];
    showCard(`<h2>${esc(c.n)}</h2><p class="meaning">${esc(c.m)}</p><p>${esc(c.b)}</p><p class="meta">${c.s} stars in the figure. ${esc(c.h)}. Best evening viewing: ${esc(c.bm)}.</p>`,x,y);}
  else{const s=found.s, c=DATA.cons[s[4]], mag=s[2].toFixed(2).replace('-','\u2212');
    showCard(`<h2>${esc(s[3]||'A star with no common name')}</h2><p class="meaning">in ${esc(c.n)}</p><p>Magnitude ${mag}. Lower numbers are brighter.</p>`,x,y);}
});
canvas.addEventListener('pointerleave',()=>{hoverAb=null;hideCard();draw();});
// view toggle
const btn=document.getElementById('view');
btn.addEventListener('click',()=>{ fromEarth=!fromEarth; rot[0]=-rot[0]; rebuildGeo(); btn.setAttribute('aria-pressed',String(!fromEarth));
  btn.textContent=fromEarth?'Show as a celestial globe':'Show as seen from Earth'; draw(); });
new ResizeObserver(size).observe(canvas);
document.fonts && document.fonts.ready.then(draw);
</script>
</body>
